{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <time class="post-date">{{ .Date.Format "January 2, 2006" }}</time>
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
    <div class="post-nav">
      {{ with .PrevInSection }}<a class="pn pn-prev" href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
      {{ with .NextInSection }}<a class="pn pn-next" href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
    </div>
    <p class="back"><a href="{{ "/" | relURL }}">← All posts</a></p>
  </article>
{{ end }}
